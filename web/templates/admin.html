<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>꼬붕.gg 관리자</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="/static/js/admin.js" defer></script>
</head>
<body class="admin-body">
    <main class="admin-shell">
        <header class="admin-header">
            <div>
                <p class="admin-eyebrow">KKOBUNG.GG</p>
                <h1>데이터베이스 관리자</h1>
                <p>운영 데이터 상태와 백업을 안전하게 관리합니다.</p>
            </div>
            <a class="admin-home-link" href="/">사이트로 돌아가기</a>
        </header>

        <section id="login-panel" class="admin-panel admin-login-panel">
            <h2>관리자 인증</h2>
            <p>Render에 등록한 ADMIN_TOKEN을 입력하세요. 토큰은 현재 탭에만 보관됩니다.</p>
            <form id="token-form" class="admin-token-form">
                <label for="admin-token">ADMIN_TOKEN</label>
                <div class="admin-token-row">
                    <input id="admin-token" type="password" autocomplete="off" required>
                    <button type="submit" class="admin-primary-button">접속</button>
                </div>
            </form>
            <p id="login-error" class="admin-message admin-error" hidden></p>
        </section>

        <div id="dashboard" hidden>
            <div class="admin-toolbar">
                <span id="connection-state" class="admin-connected">● 인증됨</span>
                <div>
                    <button id="refresh-button" type="button" class="admin-secondary-button">새로고침</button>
                    <button id="logout-button" type="button" class="admin-secondary-button">로그아웃</button>
                </div>
            </div>

            <section class="admin-stat-grid" aria-label="데이터베이스 현황">
                <article class="admin-stat-card"><span>선수</span><strong id="player-count">-</strong><small>명</small></article>
                <article class="admin-stat-card"><span>경기</span><strong id="match-count">-</strong><small>개</small></article>
                <article class="admin-stat-card"><span>DB 크기</span><strong id="database-size">-</strong><small>MB</small></article>
                <article class="admin-stat-card"><span>백업</span><strong id="backup-count">-</strong><small>개</small></article>
            </section>

            <section class="admin-panel">
                <div class="admin-section-heading">
                    <div><h2>백업 파일</h2><p>현재 데이터베이스의 백업을 만들거나 PC로 내려받을 수 있습니다.</p></div>
                    <button id="create-backup-button" type="button" class="admin-primary-button">새 백업 만들기</button>
                </div>
                <p id="action-message" class="admin-message" hidden></p>
                <div class="admin-table-wrap">
                    <table class="admin-table">
                        <thead><tr><th>파일명</th><th>생성 시각</th><th>크기</th><th>작업</th></tr></thead>
                        <tbody id="backup-list"></tbody>
                    </table>
                </div>
                <p id="empty-backups" class="admin-empty" hidden>생성된 백업이 없습니다.</p>
            </section>
        </div>
    </main>
</body>
</html>
